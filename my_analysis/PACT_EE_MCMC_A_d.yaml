# P-ACT with ACT EE only: ACT DR6 EE + Planck TT<1000, TE/EE<600 + Planck low-ell TT
#   + Planck Sroll2 low-ell EE. Spectrum-split systematics test. LCDM + A_d
theory:
  classy:
    path: global
    extra_args:
      # ---- CLASS settings of the ACT DR6 analysis: Calabrese et al. 2025 (arXiv:2503.14454), Appendix A ----
      N_ncdm: 1
      m_ncdm: 0.06
      N_ur: 2.0308
      T_cmb: 2.7255
      YHe: BBN
      non_linear: hmcode
      hmcode_version: '2020'
      recombination: HyRec
      lensing: 'yes'
      output: tCl pCl lCl mPk
      modes: s
      l_max_scalars: 9500
      delta_l_max: 1800
      P_k_max_h/Mpc: 100.
      l_logstep: 1.025
      l_linstep: 20
      perturbations_sampling_stepsize: 0.05
      l_switch_limber: 30.
      hyper_sampling_flat: 32.
      l_max_g: 40
      l_max_ur: 35
      l_max_pol_g: 60
      ur_fluid_approximation: 2
      ur_fluid_trigger_tau_over_tau_k: 130.
      radiation_streaming_approximation: 2
      radiation_streaming_trigger_tau_over_tau_k: 240.
      hyper_flat_approximation_nu: 7000.
      transfer_neglect_delta_k_S_t0: 0.17
      transfer_neglect_delta_k_S_t1: 0.05
      transfer_neglect_delta_k_S_t2: 0.17
      transfer_neglect_delta_k_S_e: 0.17
      accurate_lensing: 1
      start_small_k_at_tau_c_over_tau_h: 0.0004
      start_large_k_at_tau_h_over_tau_k: 0.05
      tight_coupling_trigger_tau_c_over_tau_h: 0.005
      tight_coupling_trigger_tau_c_over_tau_k: 0.008
      start_sources_at_tau_c_over_tau_h: 0.006
      l_max_ncdm: 30
      tol_ncdm_synchronous: 1.e-6
      # ---- not in ACT's block: only switches on the damping-scale output rd_star (spectra unchanged) ----
      compute_damping_scale: 'yes'

likelihood:
  act_split.ACTDR6CMBonlySplit:       # ACT DR6 EE ONLY (600 < ell < 6500); see act_split.py
    python_path: .                    # act_split.py must be in the folder you run from
    ell_cuts: {EE: [600, 6500]}       # spectra not listed here are removed
    stop_at_error: true
  planck_2018_lowl.EE_sroll2: null    # large-scale EE, constrains tau (ACT can't on its own)
  planck_2018_lowl.TT: null           # Planck low-ell TT
  act_dr6_cmbonly.PlanckActCut:       # Planck plik-lite, cut to TT < 1000, TE/EE < 600
    dataset_params:
      use_cl: tt te ee
      lmin_cuts: 0 0 0
      lmax_cuts: 1000 600 600
    params:
      A_planck:                       # Planck calibration tied to ACT's, as in ACT's setup
        value: "lambda A_act: A_act"
        latex: A_{\rm Planck}

# ACT's calibration prior (from Planck's dipole calibration), as in ACT's baseline
prior:
  cal_dip_prior: "lambda A_act: stats.norm.logpdf(A_act, loc=1.0, scale=0.003)"

params:
  # new params
  A_d:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 1.0, scale: 0.01}
    proposal: 0.01
    latex: A_d
    drop: true
  thomson_rescaling:
    value: "lambda A_d: A_d"
    derived: false
  # LCDM sampled params
  omega_b:
    prior: {min: 0.015, max: 0.030}     # bounded: wild points can crash CLASS
    ref: {dist: norm, loc: 0.02259, scale: 0.0001}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior: {min: 0.08, max: 0.20}
    ref: {dist: norm, loc: 0.1238, scale: 0.001}
    proposal: 0.001
    latex: \Omega_\mathrm{c} h^2
  theta_s_100:
    prior: {min: 1.03, max: 1.055}
    ref: {dist: norm, loc: 1.0418, scale: 0.0003}
    proposal: 0.0002
    latex: 100\theta_\mathrm{s}
    drop: true
  100*theta_s:
    value: "lambda theta_s_100: theta_s_100"
    derived: false
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.053, scale: 0.01}
    proposal: 0.01
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  ln10^{10}A_s:
    value: "lambda logA: logA"
    derived: false
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.9666, scale: 0.005}
    proposal: 0.004
    latex: n_\mathrm{s}
  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.0562, scale: 0.006}
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  # Derived
  H0:
    latex: H_0
  z_rec:
    latex: z_\mathrm{rec}
  # extra derived outputs (do not affect the fit)
  rs_rec:
    latex: r_{s,\mathrm{rec}}
  z_star:
    latex: z_*
  rd_star:
    latex: r_{d,*}
  z_d:
    latex: z_\mathrm{drag}
  rs_d:
    latex: r_\mathrm{drag}

sampler:
  mcmc:
    covmat: chains/PACT_EE_MCMC_A_d.covmat   # proposal from the old run (same parameters)
    Rminus1_stop: 0.01
    max_tries: 10000

output: chains/PACT_EE_MCMC_A_d_actprec
