# P-ACT with ACT TT only: ACT DR6 TT + Planck TT<1000, TE/EE<600 + Planck low-ell TT
#   + Planck Sroll2 low-ell EE. Spectrum-split systematics test. LCDM + eps_d
theory:
  classy:
    path: global
    extra_args:
      N_ur: 2.0328
      N_ncdm: 1
      m_ncdm: 0.06

likelihood:
  act_split.ACTDR6CMBonlySplit:       # ACT DR6 TT ONLY (600 < ell < 6500); see act_split.py
    python_path: .                    # act_split.py must be in the folder you run from
    ell_cuts: {TT: [600, 6500]}       # spectra not listed here are removed
    stop_at_error: true
  planck_2018_lowl.EE_sroll2: null    # large-scale EE, constrains tau (ACT can't on its own)
  planck_2018_lowl.TT: null           # Planck low-ell TT
  act_dr6_cmbonly.PlanckActCut:       # Planck plik-lite, cut to TT < 1000, TE/EE < 600
    dataset_params:
      use_cl: tt te ee
      lmin_cuts: 0 0 0
      lmax_cuts: 1000 600 600
    params:
      A_planck:                       # Planck calibration tied to ACT's, as in ACT's setup
        value: "lambda A_act: A_act"
        latex: A_{\rm Planck}

# ACT's calibration prior (from Planck's dipole calibration), as in ACT's baseline
prior:
  cal_dip_prior: "lambda A_act: stats.norm.logpdf(A_act, loc=1.0, scale=0.003)"

params:
  P_act: 1.0     # fixed: no ACT polarization in this run
  # new params
  # Signed damping envelope: C_l -> C_l exp[-eps_d (l/1000)^2], applied to the unlensed spectra.
  # eps_d > 0: extra damping (eps_d = (1000/l_d)^2); eps_d < 0: extra small-scale power; LCDM is eps_d = 0.
  # Needs the CLASS input `phenomenological_damping_eps` (signed_eps.patch).
  eps_d:
    prior: {min: -0.05, max: 0.05}
    ref: {dist: norm, loc: 0.0, scale: 0.001}
    proposal: 0.001
    latex: \epsilon_d
    drop: true
  phenomenological_damping_eps:
    value: "lambda eps_d: eps_d"
    derived: false
  # LCDM sampled params
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.02259, scale: 0.0001}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.1238, scale: 0.001}
    proposal: 0.001
    latex: \Omega_\mathrm{c} h^2
  theta_s_100:
    prior: {min: 0.5, max: 10}
    ref: {dist: norm, loc: 1.0418, scale: 0.0003}
    proposal: 0.0002
    latex: 100\theta_\mathrm{s}
    drop: true
  100*theta_s:
    value: "lambda theta_s_100: theta_s_100"
    derived: false
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.053, scale: 0.01}
    proposal: 0.01
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  ln10^{10}A_s:
    value: "lambda logA: logA"
    derived: false
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.9666, scale: 0.005}
    proposal: 0.004
    latex: n_\mathrm{s}
  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.0562, scale: 0.006}
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  # Derived
  H0:
    latex: H_0
  z_rec:
    latex: z_\mathrm{rec}

sampler:
  mcmc:
    covmat: auto
    Rminus1_stop: 0.01
    max_tries: 10000

output: chains/PACT_TT_MCMC_eps_d
