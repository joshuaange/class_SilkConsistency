# Planck TT,TE,EE + lowE + lensing + DESI DR2 BAO: LCDM + eps_d (signed damping envelope)
theory:
  classy:
    path: global
    extra_args:
      # ---- CLASS settings of the ACT DR6 analysis: Calabrese et al. 2025 (arXiv:2503.14454), Appendix A ----
      N_ncdm: 1
      m_ncdm: 0.06
      N_ur: 2.0308
      T_cmb: 2.7255
      YHe: BBN
      non_linear: hmcode
      hmcode_version: '2020'
      recombination: HyRec
      lensing: 'yes'
      output: tCl pCl lCl mPk
      modes: s
      l_max_scalars: 9500
      delta_l_max: 1800
      P_k_max_h/Mpc: 100.
      l_logstep: 1.025
      l_linstep: 20
      perturbations_sampling_stepsize: 0.05
      l_switch_limber: 30.
      hyper_sampling_flat: 32.
      l_max_g: 40
      l_max_ur: 35
      l_max_pol_g: 60
      ur_fluid_approximation: 2
      ur_fluid_trigger_tau_over_tau_k: 130.
      radiation_streaming_approximation: 2
      radiation_streaming_trigger_tau_over_tau_k: 240.
      hyper_flat_approximation_nu: 7000.
      transfer_neglect_delta_k_S_t0: 0.17
      transfer_neglect_delta_k_S_t1: 0.05
      transfer_neglect_delta_k_S_t2: 0.17
      transfer_neglect_delta_k_S_e: 0.17
      accurate_lensing: 1
      start_small_k_at_tau_c_over_tau_h: 0.0004
      start_large_k_at_tau_h_over_tau_k: 0.05
      tight_coupling_trigger_tau_c_over_tau_h: 0.005
      tight_coupling_trigger_tau_c_over_tau_k: 0.008
      start_sources_at_tau_c_over_tau_h: 0.006
      l_max_ncdm: 30
      tol_ncdm_synchronous: 1.e-6
      # ---- not in ACT's block: only switches on the damping-scale output rd_star (spectra unchanged) ----
      compute_damping_scale: 'yes'

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE_lite_native: null    # A_planck is sampled automatically
  planck_2018_lensing.native: null                   # lensing
  bao.desi_dr2.desi_bao_all: null                    # DESI DR2 BAO (all tracers)

params:
  # new params
  # Signed damping envelope: C_l -> C_l exp[-eps_d (l/1000)^2], applied to the unlensed spectra.
  # eps_d > 0: extra damping (eps_d = (1000/l_d)^2); eps_d < 0: extra small-scale power; LCDM is eps_d = 0.
  # Needs the CLASS input `phenomenological_damping_eps` (signed_eps.patch).
  eps_d:
    prior: {min: -0.05, max: 0.05}
    ref: {dist: norm, loc: 0.0, scale: 0.001}
    proposal: 0.001
    latex: \epsilon_d
    drop: true
  phenomenological_damping_eps:
    value: "lambda eps_d: eps_d"
    derived: false
  # LCDM sampled params
  omega_b:
    prior: {min: 0.015, max: 0.030}     # bounded: wild points can crash CLASS
    ref: {dist: norm, loc: 0.02237, scale: 0.0001}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior: {min: 0.08, max: 0.20}
    ref: {dist: norm, loc: 0.1200, scale: 0.001}
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  theta_s_100:
    prior: {min: 1.03, max: 1.055}
    ref: {dist: norm, loc: 1.0418, scale: 0.0003}
    proposal: 0.0002
    latex: 100\theta_\mathrm{s}
    drop: true
  100*theta_s:
    value: "lambda theta_s_100: theta_s_100"
    derived: false
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.044, scale: 0.01}
    proposal: 0.01
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  ln10^{10}A_s:
    value: "lambda logA: logA"
    derived: false
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.9649, scale: 0.004}
    proposal: 0.002
    latex: n_\mathrm{s}
  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.0544, scale: 0.006}
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  # Derived
  H0:
    latex: H_0
  z_rec:
    latex: z_\mathrm{rec}
  # extra derived outputs (do not affect the fit)
  rs_rec:
    latex: r_{s,\mathrm{rec}}
  z_star:
    latex: z_*
  rd_star:
    latex: r_{d,*}
  z_d:
    latex: z_\mathrm{drag}
  rs_d:
    latex: r_\mathrm{drag}

sampler:
  mcmc:
    covmat: chains/Planck_LB_MCMC_eps_d.covmat   # proposal from the old run (same parameters)
    Rminus1_stop: 0.01
    max_tries: 10000

output: chains/Planck_LB_MCMC_eps_d_actprec
